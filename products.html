<!DOCTYPE html>
<html>
<head>
  <title>Product Page</title>
</head>
<body>
  <h2>Products</h2>

  <input id="search" placeholder="Search by name">
  <button onclick="search()">Search</button>
  <button onclick="load()">Show All</button>
  <button onclick="logout()">Logout</button>
  <button onclick="goToCart()">🛒 Go to Cart</button>

  <ul id="list"></ul>

  <script>
    const API = "http://localhost:5000/api"; // change if needed
    const token = localStorage.getItem("token");

    if (!token) {
      window.location.href = "index.html";
    }

    async function load() {
      const res = await fetch(API + "/products", {
        headers: { "x-auth-token": token }
      });
      const data = await res.json();
      show(data);
    }

    async function search() {
      const q = document.getElementById("search").value.toLowerCase();
      const res = await fetch(API + "/products", {
        headers: { "x-auth-token": token }
      });
      const data = await res.json();
      const filtered = data.filter(p => p.name.toLowerCase().includes(q));
      show(filtered);
    }

    // function show(products) {
    //   const list = document.getElementById("list");
    //   list.innerHTML = "";
    //   products.forEach(p => {
    //     const li = document.createElement("li");
    //     li.textContent = `${p.name} - ₹${p.price}`;
    //     list.appendChild(li);
    //   });
    // }

    function show(products) {
      const list = document.getElementById("list");
      list.innerHTML = "";
      products.forEach(p => {
        const li = document.createElement("li");
        li.innerHTML = `
          ${p.name} - ₹${p.price}
          <button onclick="addToCart('${p._id}', '${p.name}', ${p.price})">Add to Cart</button>
        `;
        list.appendChild(li);
      });
    }

  async function addToCart(productId) {
  try {
    const res = await fetch(`${API}/cart/add`, {  // ✅ correct URL
      method: "POST",
      headers: {
        "x-auth-token": token,
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        productId: productId,
        quantity: 1,  // You can customize quantity if you want
      }),
    });
    const data = await res.json();
    alert("Added to cart!"); 
  } catch (err) {
    console.error("Error adding to cart:", err);
    alert("Failed to add item to cart.");
  }
}
  
    

    

    function logout() {
      localStorage.removeItem("token");
      window.location.href = "login.html";
    }
    function goToCart() {
      window.location.href = "cart.html";
    }

    load();
  </script>
</body>
</html>
