<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Your Cart</title>
  <style>
    body {
      font-family: Arial, sans-serif;
    }
    header {
      background-color: #4CAF50;
      color: white;
      padding: 10px;
      text-align: center;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 20px;
    }
    th, td {
      padding: 12px;
      border: 1px solid #ddd;
      text-align: left;
    }
    th {
      background-color: #f2f2f2;
    }
    .empty-cart {
      text-align: center;
      padding: 20px;
      font-size: 18px;
      color: #888;
    }
    .button-container {
      margin-top: 20px;
      text-align: center;
    }
    button {
      padding: 10px 18px;
      background-color: #4CAF50;
      color: white;
      border: none;
      margin: 5px;
      cursor: pointer;
      font-size: 14px;
    }
    button:hover {
      background-color: #45a049;
    }
  </style>
</head>
<body>

  <header>
    <h1>Your Cart</h1>
  </header>

  <div id="cartContent"></div>

  <div class="button-container">
    <button onclick="goBack()">Back to Products</button>
    <button onclick="placeOrder()">Place Order</button>
  </div>

  <script>
    const API = "http://localhost:5000/api"; // Update this if needed
    const token = localStorage.getItem("token");

    if (!token) {
      window.location.href = "login.html";
    }

    async function loadCart() {
      const res = await fetch(API + "/cart", {
        method: "GET",
        headers: { "x-auth-token": token }
      });
      const data = await res.json();

      if (data.msg) {
        document.getElementById("cartContent").innerHTML = `<div class="empty-cart">${data.msg}</div>`;
      } else {
        displayCart(data.cart);
      }
    }

    function displayCart(cart) {
      if (cart.products.length === 0) {
        document.getElementById("cartContent").innerHTML = `<div class="empty-cart">Your cart is empty!</div>`;
        return;
      }

      let tableHTML = `
        <h3>Cart Items</h3>
        <table>
          <thead>
            <tr>
              <th>Product Name</th>
              <th>Quantity</th>
              <th>Price</th>
              <th>Total</th>
              <th>Action</th>
            </tr>
          </thead>
          <tbody>
      `;

      cart.products.forEach(product => {
        const total = product.price * product.quantity;
        const productId = product.productId._id || product.productId;

        tableHTML += `
          <tr>
            <td>${product.productId.name}</td>
            <td>${product.quantity}</td>
            <td>₹${product.productId.price}</td>
            <td>₹${total}</td>
            <td><button onclick="removeFromCart('${productId}')">Remove</button></td>
          </tr>
        `;
      });

      tableHTML += `</tbody></table>`;
      document.getElementById("cartContent").innerHTML = tableHTML;
    }

    async function removeFromCart(productId) {
      const res = await fetch(`${API}/cart/remove/${productId}`, {
        method: "DELETE",
        headers: {
          "x-auth-token": token
        }
      });

      const data = await res.json();

      if (res.ok) {
        loadCart();
      } else {
        alert(data.msg || "Failed to remove item from cart.");
      }
    }

    async function placeOrder() {
      const res = await fetch(`${API}/orders`, {
        method: "POST",
        headers: {
          "x-auth-token": token
        }
      });

      const data = await res.json();

      if (res.ok) {
        alert("✅ Order placed successfully!");
        window.location.href = "orders.html"; // create this if needed
      } else {
        alert(data.msg || "❌ Failed to place order.");
      }
    }

    function goBack() {
      window.location.href = "products.html";
    }

    loadCart();
  </script>

</body>
</html>
